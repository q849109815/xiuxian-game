<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>向僵尸开炮</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ========== 加载 ========== -->
<div class="screen on" id="loading">
  <div class="ld-logo">💥</div>
  <div class="ld-title">向 僵 尸 开 炮</div>
  <div class="ld-sub">ZOMBIES BOOM · 末日尸潮</div>
  <div class="ld-bar"><i id="ldBar"></i></div>
  <div class="ld-txt" id="ldTxt">正在装填弹药…</div>
</div>

<!-- ========== 登录 ========== -->
<div class="screen" id="login">
  <div class="lg-box">
    <div class="lg-logo">💥</div>
    <div class="lg-t">向 僵 尸 开 炮</div>
    <div class="lg-s">末 日 尸 潮 · 守 住 最 后 防 线</div>
    <!-- 微信登录（资料 05/07：一键登录，记住账户） -->
    <div class="lg-wx" id="lgWx">
      <button class="wx-btn" id="wxLoginBtn">
        <span class="wx-ico">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M8.7 3C4.9 3 1.8 5.6 1.8 8.8c0 1.8 1 3.4 2.6 4.5l-.6 1.8 2.1-1.1c.8.2 1.6.4 2.5.4h.5c-.1-.3-.2-.7-.2-1 0-3.1 3-5.6 6.7-5.6h.5C15.6 5.2 12.5 3 8.7 3zM6.4 6.2c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9zm5.4 0c.5 0 .9.4.9.9s-.4.9-.9.9-.9-.4-.9-.9.4-.9.9-.9z"/>
            <path d="M22.2 13.4c0-2.7-2.7-4.9-6-4.9s-6 2.2-6 4.9c0 2.7 2.7 4.9 6 4.9c.7 0 1.4-.1 2-.3l1.8 1-.5-1.5c1.3-.9 2.1-2.2 2.1-3.7zm-8-2.1c.4 0 .8.3.8.8s-.3.8-.8.8-.8-.3-.8-.8.3-.8.8-.8zm4 0c.4 0 .8.3.8.8s-.3.8-.8.8-.8-.3-.8-.8.3-.8.8-.8z"/>
          </svg>
        </span>
        <span class="wx-txt">微信快捷登录</span>
      </button>
      <div class="wx-tip" id="wxTip">已记住本机账户，下次打开自动进入</div>
    </div>

    <!-- 切换账户 / 手动建号 -->
    <div class="lg-switch"><a href="javascript:;" id="lgSwitch">切换账户 · 手动建号</a></div>

    <div class="lg-manual" id="lgManual" style="display:none">
      <div class="lg-gender" id="lgGender">
        <button class="gd on" data-g="m">👨‍🚀 男</button>
        <button class="gd" data-g="f">👩‍🚀 女</button>
      </div>
      <input id="lgName" maxlength="8" placeholder="输入你的代号（2-8字）">
      <button class="lg-btn" id="lgBtn">进 入 战 区</button>
    </div>
    <div class="lg-net" id="lgNet">○ 检测网络…</div>
  </div>
</div>

<!-- ========== 基地主界面 ========== -->
<div class="screen" id="home">
  <div class="hm-top">
    <div class="hm-av" id="hmAv"><i id="hmAvIco">👨‍🚀</i></div>
    <div class="hm-info">
      <div class="hm-name"><b id="hmName">—</b><span class="hm-lv" id="hmLv">Lv.1</span></div>
      <div class="hm-pw">战力 <b id="hmPower">0</b></div>
      <div class="hm-prog">进度 <span id="hmLevel">第 1 关</span></div>
    </div>
    <div class="hm-cur">
      <span>🪙 <b id="cuGold">0</b></span>
      <span>💎 <b id="cuDia">0</b></span>
      <span>⚡ <b id="hmStamina">100/100</b></span>
    </div>
  </div>

  <div class="hm-acts">
    <button class="ha go" id="hmGo"><i>🎯</i><b>出击</b><span id="hmLevelName">第 1 关</span></button>
    <button class="ha" id="hmEndless"><i>♾️</i><b>无尽模式</b><span id="hmEndBest">最佳 0 层</span></button>
  </div>

  <div class="hm-base" id="hmBase"></div>

  <nav class="hm-nav">
    <button class="hn" data-p="role"><i>👤</i><span>角色</span></button>
    <button class="hn" data-p="gun"><i>🔫</i><span>武器</span></button>
    <button class="hn" data-p="chip"><i>🔲</i><span>芯片</span></button>
    <button class="hn" data-p="talent"><i>⭐</i><span>天赋</span></button>
    <button class="hn" data-p="task"><i>📋</i><span>任务</span></button>
    <button class="hn" data-p="bag"><i>🎒</i><span>背包</span></button>
    <button class="hn" data-p="shop"><i>🛒</i><span>商城</span></button>
    <button class="hn" data-p="act"><i>🎪</i><span>活动</span></button>
    <button class="hn" data-p="rank"><i>🏆</i><span>排行</span></button>
    <button class="hn" data-p="set"><i>⚙️</i><span>设置</span></button>
  </nav>
</div>

<!-- ========== 战斗 ========== -->
<div class="screen" id="battle">
  <canvas id="C"></canvas>
  <div class="bt-top">
    <div class="bt-l"><span id="btLevel">第 1 关</span><span id="btWave">第 1/3 波</span></div>
    <div class="bt-r"><span id="btTime">00:00</span><button id="btPause">⏸</button></div>
  </div>
  <div class="bt-hp">
    <div class="hpbar"><i id="btHpBar"></i><b id="btHpTxt">100/100</b></div>
    <div class="shbar" id="btShWrap"><i id="btShBar"></i></div>
  </div>
  <div class="bt-stats">
    <span>☠ <b id="btKill">0</b></span><span>🪙 <b id="btCoin">0</b></span><span>Lv.<b id="btLv">1</b></span>
  </div>
  <!-- 防线血条（真实玩法：漏怪突破即失败） -->
  <div class="bt-wall"><span>防线</span>
    <div class="wallbar"><i id="btWallBar"></i></div><b id="btWallTxt">0/0</b>
  </div>
  <!-- 技能栏：主动技能点击释放 -->
  <div class="bt-skills" id="btSkills"></div>
  <!-- 炮台建造栏 -->
  <div class="bt-turret" id="btTurret"></div>
  <!-- 瞄准摇杆（真实玩法：单指滑动调整炮口方向，松手自动开火） -->
  <div class="joy" id="joy"><i id="joyKnob"></i></div>
  <button class="bt-reload" id="btReload"><i>🔫</i><span id="btMag">30/30</span><em id="btReloadBar"></em></button>
  <div class="bt-tip">滑动瞄准 · 松手自动开火 · 点技能释放 · 用金币建炮台</div>
</div>

<!-- ========== 技能三选一 ========== -->
<div class="modal" id="choice">
  <div class="ch-box">
    <div class="ch-t">升 级 · 选 择 技 能</div>
    <div class="ch-sub">选择一项强化，可叠加至 10 级</div>
    <div id="chCards"></div>
    <button class="ch-rf" id="chRefresh">🔄 刷新选项</button>
  </div>
</div>

<!-- ========== 结算 ========== -->
<div class="modal" id="result">
  <div class="rs-box">
    <div class="rs-t" id="rsTitle">战 斗 胜 利</div>
    <div class="rs-lv" id="rsLevel">第 1 关</div>
    <div class="rs-grid" id="rsGrid"></div>
    <div id="rsAd"></div>
    <div class="rs-btns">
      <button class="btn c" id="rsNext">下一关</button>
      <button class="btn" id="rsAgain">再挑战</button>
      <button class="btn d" id="rsBack">返回基地</button>
    </div>
  </div>
</div>

<!-- ========== 暂停 ========== -->
<div class="modal" id="pause">
  <div class="ps-box">
    <div class="ps-t">已 暂 停</div>
    <button class="btn c blk" id="psResume">继续战斗</button>
    <button class="btn d blk" id="psQuit">放弃本关</button>
  </div>
</div>

<!-- ========== 通用面板 ========== -->
<div class="modal" id="panel">
  <div class="pn-mask" id="pnMask"></div>
  <div class="pn-box">
    <div class="pn-hd">
      <b id="pnTitle">标题</b>
      <button id="pnX">✕</button>
    </div>
    <div class="pn-tabs" id="pnTabs"></div>
    <div class="pn-body" id="pnBody"></div>
  </div>
</div>

<div id="toasts"></div>

<script src="js/net.js"></script>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/wx.js"></script>
<script src="js/audio.js"></script>
<script src="js/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a2637">
<title>向僵尸开炮</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ============ 加载 ============ -->
  <div id="loading" class="screen on">
    <div class="ld-logo">💥</div>
    <div class="ld-title">向 僵 尸 开 炮</div>
    <div class="ld-sub">末 日 尸 潮 · 守 住 防 线</div>
    <div class="ld-bar"><i id="ldBar"></i></div>
    <div class="ld-txt" id="ldTxt">正在装填弹药…</div>
  </div>

  <!-- ============ 登录 / 创角 ============ -->
  <div id="login" class="screen">
    <div class="lg-bg"></div>
    <div class="lg-box">
      <div class="lg-title">向僵尸开炮</div>
      <div class="lg-slogan">ZOMBIES BOOM · 末日先锋官</div>
      <div class="lg-field">
        <label>先锋官代号</label>
        <input id="lgName" maxlength="8" placeholder="请输入代号（2-8字）" value="先锋官">
      </div>
      <div class="lg-field">
        <label>性别</label>
        <div class="lg-gender" id="lgGender">
          <button class="gd on" data-g="m"><i>👨‍🚀</i><span>男</span></button>
          <button class="gd" data-g="f"><i>👩‍🚀</i><span>女</span></button>
        </div>
      </div>
      <button class="lg-btn" id="lgBtn">进 入 战 区</button>
      <div class="lg-tip">已有存档将自动读取 · 数据存于云端</div>
      <div class="lg-net">网络：<span id="lgNet">检测中…</span></div>
    </div>
  </div>

  <!-- ============ 基地主界面 ============ -->
  <div id="home" class="screen">
    <div class="hm-bg"></div>
    <!-- 顶部信息 -->
    <div class="hm-top">
      <div class="hm-av" id="hmAv"><i id="hmAvIco">👨‍🚀</i><em id="hmLv">Lv.1</em></div>
      <div class="hm-mid">
        <div class="hm-nm" id="hmName">先锋官</div>
        <div class="hm-pw"><span>⚔</span><b id="hmPower">0</b></div>
      </div>
      <div class="hm-cur">
        <div class="cu"><i>🪙</i><b id="cuGold">0</b></div>
        <div class="cu"><i>💎</i><b id="cuDia">0</b></div>
      </div>
    </div>

    <!-- 关卡入口大按钮 -->
    <div class="hm-main">
      <button class="hm-go" id="hmGo">
        <div class="go-t">主 线 关 卡</div>
        <div class="go-l" id="hmLevel">第 1 关</div>
        <div class="go-s" id="hmLevelName">城市大街</div>
      </button>
      <div class="hm-side">
        <button class="hm-sbtn" id="hmEndless"><i>♾️</i><span>无尽</span></button>
        <button class="hm-sbtn" id="hmRank"><i>🏆</i><span>排行</span></button>
      </div>
    </div>

    <!-- 基地模块 -->
    <div class="hm-sec">基 地</div>
    <div class="hm-base" id="hmBase"></div>

    <!-- 底部导航 -->
    <div class="hm-nav">
      <button class="hn on" data-p="role"><i>🧍</i><span>角色</span></button>
      <button class="hn" data-p="gun"><i>🔫</i><span>枪械</span></button>
      <button class="hn" data-p="bag"><i>🎒</i><span>背包</span></button>
      <button class="hn" data-p="merc"><i>👥</i><span>佣兵</span></button>
      <button class="hn" data-p="shop"><i>🏪</i><span>商城</span></button>
      <button class="hn" data-p="set"><i>⚙️</i><span>设置</span></button>
    </div>
  </div>

  <!-- ============ 战斗 ============ -->
  <div id="battle" class="screen">
    <canvas id="C"></canvas>
    <!-- 顶部 HUD -->
    <div class="bt-top">
      <button class="bt-ic" id="btPause">⏸</button>
      <div class="bt-info">
        <div class="bt-lv" id="btLevel">第 1 关</div>
        <div class="bt-wv" id="btWave">第 1 / 3 波</div>
      </div>
      <div class="bt-timer" id="btTime">00:00</div>
    </div>
    <!-- 左上：局内等级 + 经验条 -->
    <div class="bt-xp">
      <div class="xp-n">Lv.<b id="btLv">1</b></div>
      <div class="xp-bar"><i id="btXpBar"></i></div>
    </div>
    <!-- 右上：金币/击杀 -->
    <div class="bt-st">
      <div><i>🪙</i><b id="btGold">0</b></div>
      <div><i>☠️</i><b id="btKill">0</b></div>
    </div>
    <!-- 右侧技能 -->
    <div class="bt-skill" id="btSkill"></div>
    <!-- 右下能量条 -->
    <div class="bt-energy">
      <div class="en-bar"><i id="btEnergy"></i></div>
      <div class="en-t">能量</div>
    </div>
    <!-- 底部炮台建造 -->
    <div class="bt-build" id="btBuild"></div>
  </div>

  <!-- ============ 通用面板 ============ -->
  <div id="panel">
    <div class="pn-mask" id="pnMask"></div>
    <div class="pn-box">
      <div class="pn-head">
        <b id="pnTitle">面板</b>
        <button class="pn-x" id="pnX">✕</button>
      </div>
      <div class="pn-tabs" id="pnTabs"></div>
      <div class="pn-body" id="pnBody"></div>
    </div>
  </div>

  <!-- ============ 技能三选一 ============ -->
  <div id="choice">
    <div class="ch-mask"></div>
    <div class="ch-box">
      <div class="ch-t">选择技能</div>
      <div class="ch-sub" id="chSub">击杀升级！选择一项强化</div>
      <div class="ch-cards" id="chCards"></div>
      <button class="ch-refresh" id="chRefresh">🔄 刷新（观看后重置）</button>
    </div>
  </div>

  <!-- ============ 结算 ============ -->
  <div id="result">
    <div class="rs-mask"></div>
    <div class="rs-box">
      <div class="rs-t" id="rsTitle">战斗胜利</div>
      <div class="rs-lv" id="rsLevel">第 1 关</div>
      <div class="rs-grid" id="rsGrid"></div>
      <div class="rs-btns">
        <button class="rs-b c" id="rsAgain">再 战</button>
        <button class="rs-b" id="rsNext">下 一 关</button>
        <button class="rs-b d" id="rsBack">返 回 基 地</button>
      </div>
    </div>
  </div>

  <!-- ============ 暂停 ============ -->
  <div id="pause">
    <div class="ps-mask"></div>
    <div class="ps-box">
      <div class="ps-t">已暂停</div>
      <button class="ps-b c" id="psResume">继续战斗</button>
      <button class="ps-b d" id="psQuit">放弃并结算</button>
    </div>
  </div>

  <div id="toasts"></div>
</div>

<script src="js/net.js"></script>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>

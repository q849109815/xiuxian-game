<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>凡人修仙传·星海飞驰</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 加载页 ============ -->
<div id="loading" class="loading">
  <div class="ld-bg"></div>
  <div class="ld-inner">
    <div class="ld-title">凡人修仙传</div>
    <div class="ld-sub">星 海 飞 驰</div>
    <div class="ld-bar"><i id="ldBar"></i></div>
    <div class="ld-txt" id="ldTxt">正在连接星海…</div>
  </div>
</div>

<!-- ============ 登录 ============ -->
<div id="login" class="login">
  <div class="lg-stars"></div>
  <div class="lg-box">
    <div class="lg-logo">凡人修仙传</div>
    <div class="lg-slogan">星海飞驰 · 乱星海篇</div>
    <input class="lg-inp" id="lgName" placeholder="请输入道号（2-8字）" maxlength="8">
    <input class="lg-inp" id="lgPwd" type="password" placeholder="请输入口令" maxlength="20">
    <button class="lg-btn" id="btnLogin">进 入 星 海</button>
    <div class="lg-net">网络：<span id="lgNet">检测中…</span></div>
  </div>
</div>

<!-- ============ 创角 ============ -->
<div id="create" class="create">
  <div class="cr-stars"></div>
  <div class="cr-inner">
    <div class="cr-t">选择你的道体</div>
    <!-- 伪3D 角色展示 -->
    <div class="cr-stage">
      <div class="cr-halo"></div>
      <div class="cr-fig" id="crFig">🧙</div>
      <div class="cr-shadow"></div>
    </div>
    <div class="cr-row" id="crGender"></div>
    <div class="cr-lb">灵根（影响五行与功法适配）</div>
    <div class="cr-row" id="crRoot"></div>
    <div class="cr-info" id="crInfo"></div>
    <button class="cr-btn" id="btnCreate">开 始 修 行</button>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="game" class="game">
  <!-- 伪3D 星空背景（多层视差） -->
  <div class="sky">
    <div class="sky-l1" id="skyL1"></div>
    <div class="sky-l2" id="skyL2"></div>
    <div class="sky-l3" id="skyL3"></div>
    <div class="sky-neb"></div>
  </div>
  <div class="scene" id="scene"></div>

  <!-- 顶部状态栏 -->
  <div class="topbar">
    <div class="tb-avatar" id="tbAvatar">
      <div class="tb-av-in" id="tbAvIn">🧙</div>
      <div class="tb-av-frame"></div>
    </div>
    <div class="tb-mid">
      <div class="tb-name" id="tbName">道号</div>
      <div class="tb-realm" id="tbRealm">练气期</div>
      <div class="tb-expbar"><i id="tbExpBar"></i></div>
    </div>
    <div class="tb-cur">
      <div class="cur"><span class="ci stone">💎</span><b id="tbStone">0</b></div>
      <div class="cur"><span class="ci jade">🪙</span><b id="tbJade">0</b></div>
    </div>
  </div>

  <!-- 右上角：地图 / 活动 -->
  <div class="topright">
    <button class="tr-btn" id="btnMap">🗺️</button>
    <button class="tr-btn" id="btnAct">🎪</button>
    <button class="tr-btn" id="btnRank">🏆</button>
  </div>

  <!-- 左侧任务追踪栏 -->
  <div class="taskbar" id="taskbar">
    <div class="tsk-t">主线任务</div>
    <div class="tsk-name" id="tskName">—</div>
    <div class="tsk-goal" id="tskGoal">—</div>
  </div>

  <!-- 中央战斗/挂机区 -->
  <div class="center">
    <div class="boss-stage" id="bossStage">
      <div class="boss-halo"></div>
      <div class="boss-fig" id="bossFig">🐍</div>
      <div class="boss-shadow"></div>
      <div class="boss-hpwrap"><div class="boss-hp"><i id="bossHp"></i></div><div class="boss-nm" id="bossNm">—</div></div>
    </div>
    <div class="dmg-layer" id="dmgLayer"></div>
    <div class="hero-stage" id="heroStage">
      <div class="hero-halo"></div>
      <div class="hero-fig" id="heroFig">🧙</div>
      <div class="hero-shadow"></div>
    </div>
    <div class="hero-bars">
      <div class="hpb"><i id="heroHp"></i><span>气血</span></div>
      <div class="mpb"><i id="heroMp"></i><span>灵力</span></div>
    </div>
  </div>

  <!-- 战斗技能栏 -->
  <div class="skillbar" id="skillbar">
    <button class="sk-btn atk" id="skAtk"><span>⚔</span><em>普攻</em></button>
    <button class="sk-btn" data-sk="0"><span>1</span></button>
    <button class="sk-btn" data-sk="1"><span>2</span></button>
    <button class="sk-btn" data-sk="2"><span>3</span></button>
    <button class="sk-btn" data-sk="3"><span>4</span></button>
    <button class="sk-btn pet" id="skPet"><span>🐛</span><em>灵宠</em></button>
    <button class="sk-btn pup" id="skPup"><span>🗿</span><em>傀儡</em></button>
  </div>
  <div class="btl-top">
    <button class="bt-btn" id="btnAuto">自动</button>
    <button class="bt-btn" id="btnFlee">逃跑</button>
  </div>

  <!-- 底部聊天 -->
  <div class="chatbar"><div class="ch-scroll" id="chScroll"></div></div>

  <!-- 右下主按钮圆盘 -->
  <div class="wheel" id="wheel">
    <button class="wh-main" id="whMain"><span>修</span></button>
    <div class="wh-items" id="whItems"></div>
  </div>

  <!-- 面板容器 -->
  <div class="panel" id="panel">
    <div class="pn-mask" id="pnMask"></div>
    <div class="pn-box">
      <div class="pn-head">
        <b id="pnTitle">面板</b>
        <button class="pn-close" id="pnClose">✕</button>
      </div>
      <div class="pn-tabs" id="pnTabs"></div>
      <div class="pn-body" id="pnBody"></div>
    </div>
  </div>

  <!-- 提示 -->
  <div id="toasts"></div>
</div>

<script src="js/net.js"></script>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>

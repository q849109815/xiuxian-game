<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>凡人修仙传·星海飞驰</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 加载页 ============ -->
<div id="loading" class="loading">
  <div class="ld-bg"></div>
  <div class="ld-inner">
    <div class="ld-title">凡人修仙传</div>
    <div class="ld-sub">星 海 飞 驰</div>
    <div class="ld-bar"><i id="ldBar"></i></div>
    <div class="ld-txt" id="ldTxt">正在连接星海…</div>
  </div>
</div>

<!-- ============ 登录 ============ -->
<div id="login" class="login">
  <div class="lg-stars"></div>
  <div class="lg-box">
    <div class="lg-logo">凡人修仙传</div>
    <div class="lg-slogan">星海飞驰 · 乱星海篇</div>
    <input class="lg-inp" id="lgName" placeholder="请输入道号（2-8字）" maxlength="8">
    <input class="lg-inp" id="lgPwd" type="password" placeholder="请输入口令" maxlength="20">
    <button class="lg-btn" id="btnLogin">进 入 星 海</button>
    <div class="lg-net">网络：<span id="lgNet">检测中…</span></div>
  </div>
</div>

<!-- ============ 创角 ============ -->
<div id="create" class="create">
  <div class="cr-stars"></div>
  <div class="cr-inner">
    <div class="cr-t">选择你的道体</div>
    <!-- 伪3D 角色展示 -->
    <div class="cr-stage">
      <div class="cr-halo"></div>
      <div class="cr-fig" id="crFig">🧙</div>
      <div class="cr-shadow"></div>
    </div>
    <div class="cr-row" id="crGender"></div>
    <div class="cr-lb">灵根（影响五行与功法适配）</div>
    <div class="cr-row" id="crRoot"></div>
    <div class="cr-info" id="crInfo"></div>
    <button class="cr-btn" id="btnCreate">开 始 修 行</button>
  </div>
</div>

<!-- ============ 主界面 ============ -->
<div id="game" class="game">
  <!-- 伪3D 星空背景（多层视差） -->
  <div class="sky">
    <div class="sky-l1" id="skyL1"></div>
    <div class="sky-l2" id="skyL2"></div>
    <div class="sky-l3" id="skyL3"></div>
    <div class="sky-neb"></div>
  </div>
  <div class="scene" id="scene"></div>

  <!-- 顶部状态栏 -->
  <div class="topbar">
    <div class="tb-avatar" id="tbAvatar">
      <div class="tb-av-in" id="tbAvIn">🧙</div>
      <div class="tb-av-frame"></div>
    </div>
    <div class="tb-mid">
      <div class="tb-name" id="tbName">道号</div>
      <div class="tb-realm" id="tbRealm">练气期</div>
      <div class="tb-expbar"><i id="tbExpBar"></i></div>
    </div>
    <div class="tb-cur">
      <div class="cur"><span class="ci stone">💎</span><b id="tbStone">0</b></div>
      <div class="cur"><span class="ci jade">🪙</span><b id="tbJade">0</b></div>
    </div>
  </div>

  <!-- 左上玩家信息（图32：头像 + Lv + 战力 + VIP） -->
  <div class="pl-info" id="plInfo">
    <div class="pl-av"><img id="plAvImg" src="assets/char/hanli.jpg" alt=""><i id="plAvLv">1</i></div>
    <div class="pl-txt">
      <div class="pl-nm" id="plName">道号</div>
      <div class="pl-pw"><span class="pw-ic">⚔</span><b id="plPower">0</b><span class="vip" id="plVip">VIP0</span></div>
    </div>
  </div>
  <!-- 右上角：地图 / 活动 / 排行 -->
  <div class="topright">
    <button class="tr-btn" id="btnMap">🗺️</button>
    <button class="tr-btn" id="btnAct">🎪</button>
    <button class="tr-btn" id="btnRank">🏆</button>
  </div>

  <!-- 左侧任务追踪栏 -->
  <div class="taskbar" id="taskbar">
    <div class="tsk-t">主线任务</div>
    <div class="tsk-name" id="tskName">—</div>
    <div class="tsk-goal" id="tskGoal">—</div>
  </div>

  <!-- 中央战斗区（图32：多角色 vs 多怪，海面场景） -->
  <div class="center">
    <div class="btl-scene" id="btlScene"></div>

    <!-- 敌方阵列 -->
    <div class="foe-line" id="foeLine"></div>

    <!-- 我方阵列 -->
    <div class="ally-line" id="allyLine"></div>

    <!-- 伤害飘字层 -->
    <div class="dmg-layer" id="dmgLayer"></div>

    <!-- 战斗信息条 -->
    <div class="btl-info" id="btlInfo">
      <span class="bi-t" id="biTimer">00:00</span>
      <span class="bi-r" id="biRound">—</span>
    </div>
  </div>

  <!-- 战斗技能栏（图32：普攻 + 4神通 + 灵宠 + 傀儡） -->
  <div class="skillbar" id="skillbar">
    <button class="sk-btn atk" id="skAtk"><span>⚔</span><em>普攻</em></button>
    <button class="sk-btn" data-sk="0"><span>1</span><i class="cd" id="cd0"></i></button>
    <button class="sk-btn" data-sk="1"><span>2</span><i class="cd" id="cd1"></i></button>
    <button class="sk-btn" data-sk="2"><span>3</span><i class="cd" id="cd2"></i></button>
    <button class="sk-btn" data-sk="3"><span>4</span><i class="cd" id="cd3"></i></button>
    <button class="sk-btn pet" id="skPet"><span>🐛</span><em>灵宠</em><i class="cd" id="cdPet"></i></button>
    <button class="sk-btn pup" id="skPup"><span>🗿</span><em>傀儡</em><i class="cd" id="cdPup"></i></button>
  </div>

  <!-- 战斗控制（图32：自动 / 升级 / 倍速 / 逃跑） -->
  <div class="btl-top">
    <button class="bt-btn auto on" id="btnAuto">自动</button>
    <button class="bt-btn" id="btnSpeed" data-sp="1">×1</button>
    <button class="bt-btn" id="btnFlee">逃跑</button>
  </div>

  <!-- 升级提示（图32右上） -->
  <div class="lvlup" id="lvlup" style="display:none">
    <i>⬆</i><span>可升级</span>
  </div>

  <!-- 面板容器 -->
  <div class="panel" id="panel">
    <div class="pn-mask" id="pnMask"></div>
    <div class="pn-box">
      <div class="pn-head">
        <b id="pnTitle">面板</b>
        <button class="pn-close" id="pnClose">✕</button>
      </div>
      <div class="pn-tabs" id="pnTabs"></div>
      <div class="pn-body" id="pnBody"></div>
    </div>
  </div>

  <!-- 提示 -->
  <div id="toasts"></div>
</div>

<script src="js/net.js"></script>
<script src="js/config.js"></script>
<script src="js/engine.js"></script>
<script src="js/battle.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
